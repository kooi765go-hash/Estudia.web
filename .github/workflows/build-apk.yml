name: Construir APK EstudiaFacil

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar archivos
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extraer proyecto Android
        run: |
          mkdir -p proyecto
          unzip -q EstudiaFacil_Android_con_APK_automatico.zip -d proyecto

      - name: Activar AndroidX
        run: |
          PROJECT_DIR=$(find proyecto -name settings.gradle -o -name settings.gradle.kts | head -n 1 | xargs dirname)
          echo "android.useAndroidX=true" > "$PROJECT_DIR/gradle.properties"
          echo "android.enableJetifier=true" >> "$PROJECT_DIR/gradle.properties"

      - name: Construir APK
        run: |
          PROJECT_DIR=$(find proyecto -name settings.gradle -o -name settings.gradle.kts | head -n 1 | xargs dirname)
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon --stacktrace

      - name: Preparar APK
        run: |
          mkdir -p dist
          PROJECT_DIR=$(find proyecto -name settings.gradle -o -name settings.gradle.kts | head -n 1 | xargs dirname)
          find "$PROJECT_DIR/app/build/outputs/apk/debug" -name "*.apk" -exec cp {} dist/EstudiaFacil.apk \;

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: EstudiaFacil-APK
          path: dist/EstudiaFacil.apk
