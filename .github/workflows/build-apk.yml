name: Construir APK EstudiaFacil

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar archivos
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extraer proyecto Android
        run: |
          mkdir -p proyecto
          unzip -q EstudiaFacil_Android_con_APK_automatico.zip -d proyecto

      - name: Construir APK
        run: |
          PROJECT_DIR=$(find proyecto -name settings.gradle -type f -exec dirname {} \; | head -n 1)
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon -Pandroid.useAndroidX=true -Pandroid.enableJetifier=true

      - name: Preparar APK
        run: |
          mkdir -p dist
          find proyecto -path "*/app/build/outputs/apk/debug/*.apk" -exec cp {} dist/EstudiaFacil.apk \;

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: EstudiaFacil-APK
          path: dist/EstudiaFacil.apk
