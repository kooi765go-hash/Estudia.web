name: Construir APK EstudiaFacil

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar archivos
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extraer proyecto Android
        run: |
          unzip -q EstudiaFacil_Android_con_APK_automatico.zip -d proyecto
          
      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Construir APK
        working-directory: proyecto/EstudiaFacil_Android
        run: gradle assembleDebug --no-daemon

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: EstudiaFacil-APK
          path: proyecto/EstudiaFacil_Android/app/build/outputs/apk/debug/app-debug.apk
